name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  # Weekly, so a change to OpenZeppelin's published fixtures surfaces here even
  # when nothing in this repository has moved. A conformance claim that is only
  # re-checked when we happen to commit is a claim about the past.
  schedule:
    - cron: "0 6 * * 1"

jobs:
  conformance:
    name: SDK.md §6 conformance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build the SDK
        run: npm run build --workspace=stellar-confidential-token-sdk

      - name: Typecheck
        run: npm run typecheck --workspace=stellar-confidential-token-sdk

      - name: Check the vendored fixtures still match upstream
        # Vendoring keeps CI hermetic; this step is what stops the vendored copy
        # from quietly becoming a fork of the specification.
        run: node packages/conformance/scripts/check-fixtures-upstream.mjs

      - name: Check the vendored circuit library still matches the pinned commit
        # circuits/lib/ is OpenZeppelin's, vendored because nargo cannot pin a
        # git dependency to a commit. This is what keeps the pin honest.
        run: node scripts/check-lib-upstream.mjs

      - name: SDK tests
        run: npm run test --workspace=stellar-confidential-token-sdk

      - name: §6 conformance suite
        run: npm run test --workspace=@stellar-confidential/conformance

      - name: Indexer tests
        run: npm run test --workspace=@stellar-confidential/indexer

  published:
    name: The published package, as installed
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Everything above tests the source. This tests the tarball a reader
      # actually installs. A package can be broken by a bad files list, a wrong
      # exports map or a missing asset while every source test stays green. The
      # double-wrapped proof envelope shipped in 0.1.0 was exactly that shape.
      - name: Install from the registry and run the real flow
        run: node scripts/verify-published.mjs
