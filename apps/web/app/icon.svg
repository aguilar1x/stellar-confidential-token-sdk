<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="ct-sdk">
  <!--
    The mark beside the wordmark, on its own.

    The nav dot is `size-2 bg-accent` inside `ring-4 ring-accent/12`: a small
    solid dot with a halo twice its width. Those proportions are kept, but both
    radii are scaled up from the nav's 8px to fill a 32px square, because a
    faithful copy at favicon scale is a speck in a field of white and reads as a
    missing icon rather than a small one.

    The halo is lifted from the nav's 12% to 16%. At 16px, one tab among twenty,
    12% of a mid-indigo on white falls under the threshold where a screen shows
    it at all, and the icon loses the ring that distinguishes it from every
    other coloured dot.

    Square white ground rather than a transparent one: a transparent favicon
    inverts with the browser chrome, and this dot on a dark tab strip becomes an
    indigo smudge with no edge.
  -->
  <rect width="32" height="32" fill="#ffffff" />
  <circle cx="16" cy="16" r="12.5" fill="hsl(243 56% 44%)" fill-opacity="0.16" />
  <circle cx="16" cy="16" r="6.5" fill="hsl(243 56% 44%)" />
</svg>
